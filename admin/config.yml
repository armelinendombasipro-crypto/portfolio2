backend:
  name: github
  repo: armelinendombasipro-crypto/portfolio2
  branch: main
  base_url: https://sveltia-cms-auth.armelinendombasipro-199.workers.dev

# Dossier où seront rangées les images que tu ajoutes depuis le back-office
media_folder: "IMAGE"
public_folder: "/IMAGE"

collections:
  - name: "projets"
    label: "Projets"
    label_singular: "Projet"
    folder: "content/projets"
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: "titre"
    summary: "{{titre}} — {{categorie}}"
    fields:
      - label: "Identifiant unique (slug)"
        name: "slug"
        widget: "string"
        hint: "Sans espace ni accent, ex: mon-nouveau-projet. Une fois créé, ne le change plus."

      - label: "Titre du projet"
        name: "titre"
        widget: "string"

      - label: "Catégorie(s)"
        name: "categorie"
        widget: "select"
        multiple: true
        hint: "Tu peux en choisir plusieurs si un projet touche à plusieurs domaines."
        options:
          - { label: "Design graphique", value: "graphisme" }
          - { label: "UI/UX design", value: "ui-ux" }
          - { label: "Photographie", value: "photographie" }
          - { label: "Audiovisuel", value: "audiovisuel" }

      - label: "Type"
        name: "type"
        widget: "select"
        options: ["UNIVERSITAIRE", "PROFESSIONNEL"]

      - label: "Année"
        name: "annee"
        widget: "string"

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "1 = en premier sur la page Projets. Change ce numéro pour ranger tes projets exactement comme tu veux, sans jamais toucher au code."

      - label: "Vignette (image affichée sur la carte, page Projets)"
        name: "vignette"
        widget: "image"

      - label: "Description"
        name: "description"
        widget: "text"
        hint: >
          Pour créer les 3 sections dépliables (Contexte et objectifs / Réalisations /
          Bilan et savoir-être), écris exactement comme ceci, sans retour à la ligne réel
          (utilise <br><br> entre les sections) :
          <b>CONTEXTE ET OBJECTIFS</b><br>Ton texte...<br><br><b>RÉALISATIONS</b><br>Ton texte...<br><br><b>BILAN ET SAVOIR-ÊTRE</b><br>Ton texte...

      - label: "Compétences acquises"
        name: "competences"
        widget: "list"
        hint: "Une compétence par ligne, ex : montage vidéo"

      - label: "Outils utilisés"
        name: "outils"
        widget: "list"
        hint: "Un outil par ligne, ex : Premiere Pro"

      - label: "Images / vidéos principales (colonne de gauche)"
        name: "imagesPrincipales"
        widget: "list"
        field: { label: "Fichier", name: "item", widget: "file" }
        hint: "Pour une vidéo, si elle n'apparaît pas dans le sélecteur, colle son chemin à la main, ex : VIDÉO/mon-fichier.mp4"

      - label: "Galerie (photos ou vidéos en bas de page)"
        name: "galerie"
        widget: "list"
        field: { label: "Fichier (photo ou vidéo)", name: "item", widget: "file", required: false }
        required: false

      - label: "Lien externe (Figma, InDesign, site en ligne...)"
        name: "urlProjet"
        widget: "string"
        required: false

  - name: "page_apropos"
    label: "Page À propos"
    files:
      - name: "reglages"
        label: "Réglages de la page"
        file: "content/apropos.json"
        fields:
          - label: "Ma photo"
            name: "photo"
            widget: "image"
